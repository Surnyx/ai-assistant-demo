<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI 助手">
    <meta name="format-detection" content="telephone=no">
    <title>登录 - AI 智能助手</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<main class="login-card">
    <div class="brand-mark" aria-hidden="true">AI</div>
    <h1>AI 智能助手</h1>
    <p class="login-subtitle">登录后开始你的智能对话</p>

    <form id="login-form" class="login-form">
        <label for="username">用户名</label>
        <input id="username"
               name="username"
               type="text"
               value="test"
               maxlength="50"
               autocomplete="username"
               required>

        <label for="password">密码</label>
        <input id="password"
               name="password"
               type="password"
               maxlength="100"
               autocomplete="current-password"
               required>

        <p id="login-error" class="form-error" role="alert"></p>
        <button id="login-button" class="primary-button" type="submit">登录</button>
    </form>

    <p class="demo-account">演示账号：test / 123456</p>
</main>

<script src="/js/pwa.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
