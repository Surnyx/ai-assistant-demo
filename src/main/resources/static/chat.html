<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI 助手">
    <meta name="format-detection" content="telephone=no">
    <title>AI 智能助手</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="chat-page">
<main class="chat-layout">
    <aside id="conversation-sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="mini-brand-mark" aria-hidden="true">AI</span>
                <span>智能助手</span>
                <button id="sidebar-close" class="sidebar-close" type="button" aria-label="关闭历史会话">×</button>
            </div>
            <button id="new-conversation-button" class="new-chat-button" type="button">
                <span aria-hidden="true">＋</span>
                新建对话
            </button>
        </div>

        <div class="history-heading">历史会话</div>
        <nav id="conversation-list" class="conversation-list" aria-label="历史会话"></nav>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭历史会话" hidden></button>

    <section class="chat-main">
        <header class="chat-header">
            <button id="sidebar-toggle"
                    class="menu-button"
                    type="button"
                    aria-label="打开历史会话"
                    aria-controls="conversation-sidebar"
                    aria-expanded="false">☰</button>
            <div class="chat-title-group">
                <h1 id="conversation-title">AI 助手</h1>
                <p>简单、专注的智能对话 Demo</p>
            </div>
            <span class="mock-badge">AI Chat</span>
        </header>

        <div id="message-list" class="message-list" aria-live="polite">
            <div class="empty-state">
                <div class="empty-icon" aria-hidden="true">✦</div>
                <h2>你好，我是 AI 助手</h2>
                <p>点击“新建对话”，然后输入你想了解的问题。</p>
            </div>
        </div>

        <div class="composer-area">
            <form id="chat-form" class="composer">
                <label class="visually-hidden" for="message-input">输入消息</label>
                <textarea id="message-input"
                          rows="1"
                          maxlength="4000"
                          placeholder="输入消息"
                          disabled></textarea>
                <button id="send-button" class="send-button" type="submit" disabled>发送</button>
            </form>
            <p id="chat-error" class="chat-error" role="alert"></p>
        </div>
    </section>
</main>

<script src="/js/pwa.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
